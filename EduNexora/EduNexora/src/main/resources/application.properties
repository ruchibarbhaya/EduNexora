spring.application.name=EduNexora

# Datasource configuration (overridable by environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:gnims}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Session Configuration (30 minutes idle timeout)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# First Admin Configuration
cms.admin.username=${CMS_ADMIN_USERNAME:admin}
cms.admin.email=${CMS_ADMIN_EMAIL:admin@edunexora.com}
cms.admin.password=${CMS_ADMIN_PASSWORD:Admin@123}

